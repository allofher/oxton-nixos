# fuzzel — the $mod+d launcher. Symlinked to ~/.config/fuzzel/fuzzel.ini.
# Full reference: `man 5 fuzzel.ini`.

# JetBrainsMono Nerd Font is the one monospace face installed (fonts.packages
# in configuration.nix). Naming it explicitly rather than taking fontconfig's
# default avoids the launcher rendering in Cormorant, which is a display serif
# and unreadable at this size.
font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes

# Roughly centred palette-shaped box rather than fuzzel's default narrow
# column. 15 lines is about the most that stays scannable at a glance.
lines=15
width=60
horizontal-pad=20
vertical-pad=12
inner-pad=4

# Show .desktop icons. Needs an icon theme to resolve against — Adwaita comes
# in via adwaita-icon-theme in systemPackages; without it this silently
# renders blank squares.
icons-enabled=yes
icon-theme=Adwaita

# The bit that makes it feel like a palette. `fzf` is fzf-style subsequence
# matching — "fox" finds Firefox, and it prioritises word boundaries, so
# initials work. The alternative `fuzzy` is levenshtein/typo-tolerant, which
# matches more loosely but ranks worse for the "type initials" habit.
# (NB: fuzzel's old `fuzzy=yes` key was removed in favour of this in 1.9.)
match-mode=fzf

# Include .desktop "actions" — e.g. Firefox's "Open a New Private Window"
# shows up as its own entry instead of being buried in the app.
show-actions=yes

# Default terminal for .desktop entries with Terminal=true. Without this
# fuzzel hardcodes xterm, which isn't installed, so those entries do nothing.
terminal=foot

[colors]
# Dark, slightly translucent. Last two hex digits are alpha.
background=1c1c1ce6
text=d8d8d8ff
match=7aa2f7ff
selection=2c2c2cff
selection-text=ffffffff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=6

[key-bindings]
# Esc and Ctrl+g both dismiss, matching readline/emacs muscle memory.
cancel=Escape Control+g
